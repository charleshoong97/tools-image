<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Compressor</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span>Image Compressor</span>
      </div>
      <button id="theme-toggle" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg id="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Upload zone -->
    <section id="upload-zone" role="button" tabindex="0" aria-label="Drop images here or click to select">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
      </svg>
      <p class="upload-label">Drag &amp; drop images here</p>
      <p class="upload-sub">or <span class="link-text">browse files</span></p>
      <p class="upload-formats">Supports JPEG &amp; PNG &nbsp;&bull;&nbsp; Max 20 MB each</p>
      <input type="file" id="file-input" accept=".jpg,.jpeg,.png" multiple hidden />
    </section>

    <!-- Controls -->
    <section id="controls">
      <div class="control-row">
        <label for="quality-slider" id="quality-label">Quality: 75</label>
        <div class="slider-wrap">
          <span class="slider-hint">Smaller</span>
          <input type="range" id="quality-slider" min="1" max="100" value="75" />
          <span class="slider-hint">Better</span>
        </div>
      </div>
      <button id="compress-btn" class="primary-btn" disabled>
        Compress Images
      </button>
    </section>

    <!-- Progress -->
    <div id="progress-wrap" hidden>
      <progress id="upload-progress" value="0" max="100"></progress>
      <span id="progress-label">Uploading…</span>
    </div>

    <!-- Error banner -->
    <div id="error-banner" class="error-banner" hidden></div>

    <!-- Results -->
    <section id="results" hidden>
      <div class="results-header">
        <h2>Results <span id="result-count" class="badge"></span></h2>
        <div class="results-actions">
          <button id="download-all-btn" class="secondary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download All (.zip)
          </button>
          <button id="clear-btn" class="ghost-btn">Clear</button>
        </div>
      </div>
      <div id="cards-container"></div>
    </section>
  </main>

  <script src="/static/js/main.js"></script>
</body>
</html>
